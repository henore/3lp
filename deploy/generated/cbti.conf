# Generated HTTP bootstrap; Certbot adds HTTPS. Do not overwrite after certificate setup.
server {
    listen 80;
    server_name simple-cbt-i.biz;
    root /var/www/cbti;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/cbti.access.log lp_access;
    error_log /var/log/nginx/cbti.error.log warn;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location = /og.png { add_header Cache-Control "public, max-age=3600"; }
    location /screenshots/ { add_header Cache-Control "public, max-age=3600"; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
